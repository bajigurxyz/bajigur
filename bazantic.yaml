# Reference for the Bazantic listing. The CLI (0.8.0) has no manifest apply yet;
# the live gateway was created with `baz gateway add` and is configured in the
# dashboard: slug tuguge4rzbcsvgrevhkkjf43em, upstream auth api-key in header
# x-bajigur-gateway-key (= GATEWAY_KEY on the API).
version: 1

gateways:
  - handle: bajigur
    listing:
      name: "Bajigur design prompts"
      category: AI
      tagline: "Pay-per-use motion/web design prompts for coding agents"
      description: >-
        A marketplace of motion and web design prompts. Search the catalogue for
        free, then unlock the full prompt text per call. Unlocking is gated by
        x402 v2 on Hedera (USDC or HBAR), paid straight to the prompt's creator,
        and every purchase mints an onchain licence so the same wallet re-reads
        the prompt for free from any client.
      tags: ["design", "motion", "prompts", "frontend", "x402", "hedera"]
      product_website: https://api.bajigur.xyz
      docs_url: https://github.com/bajigurxyz/bajigur

    upstream:
      url: https://api.bajigur.xyz
      spec:
        type: openapi
        url: https://api.bajigur.xyz/openapi.json
      auth:
        type: api-key
        delivery: header
        header_name: x-bajigur-gateway-key
        secret: ${GATEWAY_KEY}
      protocol: rest

    default_price: 0

    methods:
      - verb: GET
        path: /prompts
      - verb: GET
        path: /prompts/{id}
      - verb: GET
        path: /prompts/{id}/unlock
        price: $0.10
      - verb: GET
        path: /discovery/resources
      - verb: GET
        path: /licenses/{account}

    status: active
